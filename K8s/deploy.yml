apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-container
          image: nishanrai29/realtime:latest
          ports:
            - containerPort: 80
