<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Year Countdown 🎆</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 50% 20%, #26346d 0%, #11162f 35%, #050713 75%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ---------- STARS ---------- */

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            animation: twinkle 2s infinite alternate;
        }

        .star:nth-child(1) { left: 8%; top: 15%; animation-delay: .2s; }
        .star:nth-child(2) { left: 18%; top: 35%; animation-delay: .7s; }
        .star:nth-child(3) { left: 28%; top: 12%; animation-delay: 1.1s; }
        .star:nth-child(4) { left: 38%; top: 28%; animation-delay: .4s; }
        .star:nth-child(5) { left: 50%; top: 10%; animation-delay: 1.5s; }
        .star:nth-child(6) { left: 62%; top: 25%; animation-delay: .8s; }
        .star:nth-child(7) { left: 72%; top: 13%; animation-delay: 1.2s; }
        .star:nth-child(8) { left: 84%; top: 32%; animation-delay: .5s; }
        .star:nth-child(9) { left: 92%; top: 18%; animation-delay: 1.7s; }
        .star:nth-child(10) { left: 12%; top: 65%; animation-delay: .9s; }
        .star:nth-child(11) { left: 30%; top: 75%; animation-delay: .3s; }
        .star:nth-child(12) { left: 70%; top: 70%; animation-delay: 1.4s; }
        .star:nth-child(13) { left: 88%; top: 62%; animation-delay: .6s; }
        .star:nth-child(14) { left: 55%; top: 82%; animation-delay: 1s; }
        .star:nth-child(15) { left: 42%; top: 58%; animation-delay: .1s; }

        @keyframes twinkle {
            from {
                opacity: .25;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* ---------- MAIN CARD ---------- */

        .container {
            position: relative;
            z-index: 5;
            width: min(900px, 92%);
            text-align: center;
            padding: 45px 30px;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, .18);
            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .5),
                inset 0 0 30px rgba(255, 255, 255, .04);

            animation: appear 1.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .small-title {
            font-size: 1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #b8c4ff;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 800;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #7fffd4,
                #ffd166,
                #ffffff
            );

            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: gradientMove 5s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 300% center;
            }
        }

        .subtitle {
            color: #c9cee9;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* ---------- COUNTDOWN ---------- */

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 0 auto 35px;
            max-width: 760px;
        }

        .time-box {
            position: relative;
            padding: 25px 10px;
            border-radius: 20px;

            background: rgba(0, 0, 0, .28);
            border: 1px solid rgba(255, 255, 255, .13);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .25),
                inset 0 0 20px rgba(255, 255, 255, .03);

            transition: transform .3s ease, box-shadow .3s ease;
        }

        .time-box:hover {
            transform: translateY(-8px);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, .35),
                0 0 25px rgba(0, 255, 204, .15);
        }

        .number {
            display: block;
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 700;
            color: #00ffcc;
            text-shadow:
                0 0 10px rgba(0, 255, 204, .7),
                0 0 25px rgba(0, 255, 204, .3);
            font-variant-numeric: tabular-nums;
        }

        .label {
            display: block;
            margin-top: 8px;
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #aeb5d1;
        }

        /* ---------- MESSAGE ---------- */

        #message {
            color: #ffd166;
            font-size: 1.1rem;
            min-height: 28px;
            text-shadow: 0 0 15px rgba(255, 209, 102, .5);
        }

        /* ---------- CONFETTI ---------- */

        .confetti {
            position: absolute;
            width: 8px;
            height: 14px;
            top: -20px;
            z-index: 2;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* ---------- FIREWORKS ---------- */

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            z-index: 1;
            animation: explode 2s ease-out infinite;
        }

        .firework::before,
        .firework::after {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow:
                0 -80px 0 #ff4d6d,
                0 80px 0 #00ffcc,
                80px 0 0 #ffd166,
                -80px 0 0 #8a7dff,
                56px 56px 0 #ff8fab,
                -56px -56px 0 #00e5ff,
                56px -56px 0 #ffd166,
                -56px 56px 0 #7cffcb;
        }

        .firework::after {
            transform: rotate(45deg);
        }

        .firework.one {
            left: 15%;
            top: 22%;
            animation-delay: .2s;
        }

        .firework.two {
            right: 15%;
            top: 25%;
            animation-delay: 1s;
        }

        .firework.three {
            left: 82%;
            top: 70%;
            animation-delay: 1.5s;
        }

        @keyframes explode {
            0%, 100% {
                opacity: 0;
                transform: scale(.1);
            }

            30% {
                opacity: 1;
                transform: scale(.4);
            }

            60% {
                opacity: .8;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }

        /* ---------- FOOTER ---------- */

        .footer {
            margin-top: 25px;
            color: #777e9f;
            font-size: .8rem;
            letter-spacing: 1px;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 600px) {

            .container {
                padding: 35px 15px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .time-box {
                padding: 18px 8px;
            }

            .subtitle {
                font-size: .9rem;
            }

            .small-title {
                font-size: .75rem;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Stars -->
    <div class="stars">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
    </div>

    <!-- Fireworks -->
    <div class="firework one"></div>
    <div class="firework two"></div>
    <div class="firework three"></div>

    <!-- Main Content -->
    <main class="container">

        <div class="small-title">
            ✨ The countdown begins ✨
        </div>

        <h1>Happy New Year 🎆</h1>

        <p class="subtitle">
            Counting down to an amazing new beginning
        </p>

        <div class="countdown">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>

        </div>

        <div id="message">
            🎇 Something amazing is coming...
        </div>

        <div class="footer">
            ✨ Make every second count ✨
        </div>

    </main>

    <!-- JavaScript -->
    <script>

        /*
         * Automatically determine the next New Year.
         * Example:
         * If the current year is 2026,
         * the countdown targets January 1, 2027.
         */

        function getNextNewYear() {

            const now = new Date();

            return new Date(
                now.getFullYear() + 1,
                0,
                1,
                0,
                0,
                0
            );
        }

        let newYear = getNextNewYear();

        function updateCountdown() {

            const now = new Date();

            let difference = newYear - now;

            /*
             * If New Year has arrived,
             * automatically start counting toward
             * the following New Year.
             */

            if (difference <= 0) {

                newYear = getNextNewYear();

                difference = newYear - now;

                document.getElementById("message").textContent =
                    "🎉 HAPPY NEW YEAR! 🎆🥳";

            } else {

                document.getElementById("message").textContent =
                    "🎇 Something amazing is coming...";
            }

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        /*
         * Create falling confetti dynamically
         */

        function createConfetti() {

            const confetti = document.createElement("div");

            confetti.classList.add("confetti");

            confetti.style.left =
                Math.random() * 100 + "vw";

            confetti.style.animationDuration =
                (Math.random() * 4 + 4) + "s";

            confetti.style.animationDelay =
                Math.random() * 5 + "s";

            confetti.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            /*
             * Random shape
             */

            const shapes = [
                "2px",
                "50%"
            ];

            confetti.style.borderRadius =
                shapes[Math.floor(Math.random() * shapes.length)];

            /*
             * Random colors using CSS variables
             */

            const colors = [
                "#ff4d6d",
                "#ffd166",
                "#00ffcc",
                "#8a7dff",
                "#ffffff",
                "#ff8fab"
            ];

            confetti.style.background =
                colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(confetti);

            /*
             * Remove after animation
             */

            setTimeout(() => {
                confetti.remove();
            }, 9000);
        }

        /*
         * Generate confetti continuously
         */

        setInterval(createConfetti, 180);

        /*
         * Start countdown immediately
         */

        updateCountdown();

        /*
         * Update every second
         */

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
